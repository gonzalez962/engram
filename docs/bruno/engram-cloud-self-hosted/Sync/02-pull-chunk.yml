info:
  name: Pull Chunk
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/sync/pull/{{chunkId}}"
  params:
    query:
      - name: project
        value: "{{project}}"
        enabled: true
  headers:
    - name: Accept
      value: application/json

settings:
  encodeUrl: true

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.headers.content-type
      operator: contains
      value: application/json
  scripts:
    - type: tests
      code: |-
        test("Chunk body is non-empty", function() {
          if (typeof res.body === "string") {
            expect(res.body.length).to.be.greaterThan(0);
          } else {
            expect(res.body).to.be.an("object");
          }
        });

docs: |-
  Returns the raw chunk payload for a single chunk id. The body is the
  `engramsync.ChunkData` JSON itself (`sessions`, `observations`,
  `prompts`, and optionally `mutations` arrays).

  Source: `internal/cloud/cloudserver/cloudserver.go` → `handlePullChunk`
  (line 438).

  Path params:
    - `chunkID` — the 8-char SHA-256 prefix from `01-pull-manifest`.

  Query params:
    - `project` (required).

  Status codes:
    - 200 — chunk bytes returned (JSON `application/json`).
    - 400 — `chunkID` empty or `project` missing.
    - 401 — Bearer token missing/invalid.
    - 403 — token does not authorize `project`.
    - 404 — chunk not found (the server returns `cloudstore.ErrChunkNotFound`).
